<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — Paryushan Agent</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f5; color: #1a1a1a;
    }
    header {
      background: #fff; border-bottom: 1px solid #e0e0e0; padding: 0 24px;
      display: flex; align-items: center; gap: 24px;
    }
    header h1 { font-size: 16px; font-weight: 600; margin: 0; padding: 16px 0; white-space: nowrap; }
    nav { display: flex; gap: 4px; }
    nav a {
      display: block; padding: 16px 14px; text-decoration: none; color: #555;
      border-bottom: 2px solid transparent; font-size: 14px;
    }
    nav a.active { color: #1a1a1a; border-bottom-color: #b8452f; font-weight: 600; }
    nav a:hover { color: #1a1a1a; }
    main { max-width: 960px; margin: 0 auto; padding: 24px; }
    h2 { font-size: 20px; margin: 0 0 16px; }
    h3 { font-size: 15px; margin: 24px 0 8px; color: #444; }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 8px;
      padding: 16px; margin-bottom: 12px;
    }
    .muted { color: #777; font-size: 13px; }
    .badge {
      display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px;
      border-radius: 10px; text-transform: uppercase;
    }
    .badge.pending { background: #fdecea; color: #b8452f; }
    .badge.answered { background: #eaf4ea; color: #2e7d32; }
    .badge.faq { background: #e8eef7; color: #2a5db0; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { color: #777; font-weight: 600; font-size: 12px; text-transform: uppercase; }
    tr:hover td { background: #fafafa; }
    a.row-link { color: #1a1a1a; text-decoration: none; }
    a.row-link:hover { text-decoration: underline; }
    form.inline { margin: 0; }
    textarea, input[type=text], input[type=date], select {
      width: 100%; padding: 8px 10px; border: 1px solid #d5d5d5; border-radius: 6px;
      font-size: 14px; font-family: inherit; margin-top: 4px;
    }
    label { display: block; font-size: 13px; font-weight: 600; margin-top: 10px; color: #444; }
    button {
      background: #b8452f; color: #fff; border: none; border-radius: 6px;
      padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px;
    }
    button:hover { background: #9c3a27; }
    button.secondary { background: #fff; color: #444; border: 1px solid #d5d5d5; }
    button.secondary:hover { background: #f0f0f0; }
    .flash { background: #eaf4ea; border: 1px solid #c8e0c8; color: #2e7d32;
      padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; }
    .flash.flash-error { background: #fdecea; border-color: #f3c6c0; color: #b8452f; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .empty { color: #999; font-size: 14px; padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Louisville Sangh Paryushan — Admin</h1>
    <nav>
      <a href="/admin/inbox" class="{{ 'active' if active_tab == 'inbox' }}">Inbox</a>
      <a href="/admin/content" class="{{ 'active' if active_tab == 'content' }}">Content</a>
      <a href="/admin/users" class="{{ 'active' if active_tab == 'users' }}">Users</a>
      <a href="/admin/broadcast" class="{{ 'active' if active_tab == 'broadcast' }}">Broadcast</a>
    </nav>
  </header>
  <main>
    {% if flash %}<div class="flash{{ ' flash-error' if flash_type == 'error' else '' }}">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
